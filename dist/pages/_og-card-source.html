<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmac | Play Windows games on Macs</title>
<style>
  @font-face {
    font-family: "Plus Jakarta Sans";
    src: url("fonts/plus-jakarta-sans-latin.woff2") format("woff2");
    font-weight: 400 700;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px;
    background: #FFFFFF;
    color: #161212;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .card {
    width: 1200px; height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    position: relative;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(113, 49, 49, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(113, 49, 49, 0.055) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 56% 78% at 92% 50%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.45) 45%, rgba(0, 0, 0, 0) 82%);
    mask-image: radial-gradient(ellipse 56% 78% at 92% 50%, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.45) 45%, rgba(0, 0, 0, 0) 82%);
  }
  .center-stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .wordmark-svg {
    width: 520px;
    height: auto;
    display: block;
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 34px;
    font-weight: 500;
    color: #5E5454;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="bg-grid"></div>
    <div class="center-stack">
      <svg class="wordmark-svg" viewBox="0 0 294 92" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(-9 -7) scale(0.265)">
          <path d="M 189 183 L 217 200 L 189 217 Z" fill="#713131" stroke="#713131" stroke-width="5" stroke-linejoin="round"/>
          <path d="M 292.1 117.0 A 124 124 0 1 0 324 200 L 248 200" stroke="#713131" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 250.5 154.5 A 68 68 0 1 0 234.0 258.9" stroke="#713131" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g stroke="#161212" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 94 36 L 94 76 M 94 53 A 17 17 0 0 1 128 53 L 128 76 M 128 53 A 17 17 0 0 1 162 53 L 162 76"/>
          <circle cx="200" cy="56" r="20"/>
          <path d="M 220 36 L 220 76"/>
          <path d="M 272.9 42.6 A 20 20 0 1 0 272.9 69.4"/>
        </g>
      </svg>
      <div class="tagline">Play Windows games on Macs.</div>
    </div>
  </div>
</body>
</html>
