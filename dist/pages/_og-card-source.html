<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gmac | Play Windows games on Macs</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px;
    background: #FFFFFF;
    color: #161212;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .card {
    width: 1200px; height: 630px;
    padding: 76px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #FFFFFF;
    border-top: 6px solid #713131;
    position: relative;
  }
  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-mark {
    width: 112px;
    height: auto;
    display: block;
  }
  .site-label {
    font-size: 20px;
    font-weight: 500;
    color: #5E5454;
    letter-spacing: -0.01em;
  }
  .body {
    max-width: 820px;
  }
  .wordmark {
    font-size: 118px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 0.96;
    margin-bottom: 24px;
    color: #161212;
  }
  .wordmark span {
    color: #713131;
  }
  .tagline {
    font-size: 38px;
    font-weight: 500;
    color: #5E5454;
    letter-spacing: -0.015em;
    line-height: 1.22;
  }
  .chips {
    display: flex;
    gap: 12px;
  }
  .chip {
    font-size: 19px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 6px;
    border: 1px solid #E2D8D8;
    color: #161212;
    background: #FAF7F7;
    white-space: nowrap;
  }
  .chip.accent {
    border-color: #713131;
    background: #713131;
    color: #FFFFFF;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <svg class="brand-mark" viewBox="0 0 560 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M 87.5 34.0 C 49.4 41.5, 34.8 82.2, 36.0 116.5 C 31.5 222.0, 165.4 244.8, 242.5 236.0 C 182.6 205.9, 115.8 192.5, 56.0 162.0 C 136.8 148.9, 221.0 147.0, 301.0 160.0 C 417.0 176.5, 503.6 274.6, 524.0 386.0"
          stroke="#713131"
          stroke-width="11"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <div class="site-label">rolling7ho.github.io/gmac</div>
    </div>
    <div class="body">
      <div class="wordmark"><span>G</span>mac</div>
      <div class="tagline">Play Windows games on Macs.</div>
    </div>
    <div class="chips">
      <span class="chip accent">Apple Silicon</span>
      <span class="chip">macOS 15 or later</span>
      <span class="chip">GPL v3</span>
    </div>
  </div>
</body>
</html>
