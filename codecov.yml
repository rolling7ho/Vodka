# Codecov Configuration for Vodka
# https://docs.codecov.io/docs/codecovyml-reference

# Coverage settings
coverage:
  # Overall project coverage thresholds
  status:
    project:
      default:
        # Target coverage percentage (start low, increase over time)
        target: 50%
        # Allow coverage to drop by this much without failing
        threshold: 5%
        # Set coverage status to error if CI build fails
        if_ci_failed: error
        # Only post coverage status on pull requests, not on commits to default branch
        only_pulls: true
        # Gate on VodkaKit unit-test coverage only. The best-effort app-target (vodkaapp)
        # coverage from UI tests is informational and must not drag this project gate down.
        flags:
          - vodkakit
    # Per-patch (diff) coverage requirements
    patch:
      default:
        # Require new code to have at least 60% coverage
        target: 60%
        threshold: 10%
        # Same rationale as the project gate: only VodkaKit has real unit-test
        # coverage. A diff that is mostly app-target SwiftUI code would otherwise
        # be judged against best-effort UI-test coverage and fail unavoidably.
        flags:
          - vodkakit

  # Precision of coverage percentage (2 decimal places)
  precision: 2
  round: down
  range: "40...100"

# Comment configuration for pull requests
comment:
  layout: "header, diff, flags, components"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# Flag management
flags:
  vodkakit:
    paths:
      - VodkaKit/Sources/**
    carryforward: true
  vodkaapp:
    paths:
      - Vodka/**
    carryforward: true

# Ignore paths from coverage calculation
ignore:
  - "VodkaKit/Tests/**"
  - "VodkaTests/**"
  - "VodkaUITests/**"
  - "**/*.generated.swift"
  - "**/Preview Content/**"

# Path fixes for CI environment
# Not needed - coverage report already contains correct relative paths

# Component definitions for better reporting
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 5%
  individual_components:
    - component_id: vodkakit
      name: VodkaKit
      paths:
        - VodkaKit/Sources/**
    - component_id: vodkaapp
      name: Vodka (app)
      paths:
        - Vodka/**
