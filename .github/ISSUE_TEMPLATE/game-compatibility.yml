name: Game Compatibility Report
description: A specific game fails to launch, crashes, or runs poorly.
labels: ["game-compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for **game-specific** issues where a game crashes, freezes, renders incorrectly, or fails to launch.
        For non-game bugs (Gmac interface, PC creation, or runtime downloads), use the **Bug Report** template instead.

        **Before filing:**
        - Check **PC › Advanced › Game Presets** inside Gmac to see whether a preset already exists.
        - Search [existing issues](https://github.com/rolling7ho/gmac/issues?q=is%3Aissue+label%3Agame-compatibility).
  - type: input
    id: game-name
    attributes:
      label: Game name
      placeholder: "e.g., Baldur's Gate 3"
    validations:
      required: true
  - type: input
    id: game-store
    attributes:
      label: Store / launcher
      description: Where the game was purchased or launched from.
      placeholder: "e.g., Steam, Epic, GOG, EA App, standalone installer"
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Compatibility rating
      description: Match the GameDB rating definitions.
      options:
        - "Works: runs with no issues"
        - "Playable: runs with minor issues or required tweaks"
        - "Broken: crashes, freezes, or unplayable"
        - "Will not launch: installer or launcher fails before game loads"
    validations:
      required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: Describe the symptom (crash on launch, black screen, poor performance, or audio dropout).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps taken
      description: Include any settings or tweaks (graphics backend, registry edits, winetricks verbs, or environment variables) applied before hitting the issue.
    validations:
      required: true
  - type: dropdown
    id: graphics-backend
    attributes:
      label: Graphics backend tried
      options:
        - "Automatic (Recommended)"
        - "DirectX 12 (D3DMetal)"
        - "DirectX 11 (DXMT)"
        - "DirectX 11 (Compatibility / DXVK)"
        - "DirectX 9 / OpenGL / Vulkan (WineD3D)"
        - "Gmac DirectX 12 (DXMT / gmacmetal)"
    validations:
      required: true
  - type: input
    id: gamedb-id
    attributes:
      label: GameDB entry id (if applied)
      description: Entry identifier from **Game Presets**, such as `baldurs-gate-3`. Leave blank if no preset exists.
      placeholder: "e.g., baldurs-gate-3"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Wine log (relevant excerpt)
      description: |
        Press **⌘L** in Gmac to open the Wine logs folder and paste the lines around the crash or error.
      render: bash
    validations:
      required: false
  - type: input
    id: gmac-version
    attributes:
      label: Gmac version
      placeholder: "e.g., 4.1.1"
    validations:
      required: true
  - type: dropdown
    id: mac-version
    attributes:
      label: macOS version
      options:
        - "Sequoia (macOS 15.0)"
        - "Sequoia (macOS 15.1)"
        - "Sequoia (macOS 15.2)"
        - "Sequoia (macOS 15.3)"
        - "Sequoia (macOS 15.4)"
        - "Sequoia (macOS 15.5+)"
        - "Tahoe (macOS 26)"
        - "macOS 27"
        - "Other (specify in description)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Apple Silicon model and unified memory from **Apple Menu › About This Mac**.
      placeholder: "e.g., MacBook Pro M4 Max, 64 GB"
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Anti-cheat
      description: Kernel-level anti-cheat drivers are incompatible with Wine on macOS.
      options:
        - label: This game uses an anti-cheat system (EasyAntiCheat, BattlEye, Vanguard, Denuvo, or similar) that I am aware of.
          required: false
  - type: checkboxes
    attributes:
      label: Pre-flight checks
      options:
        - label: I checked **PC › Advanced › Game Presets** for an existing preset.
          required: true
        - label: I am running **this fork** (`rolling7ho/gmac`, confirmed via **Gmac › About Gmac**) rather than the archived Whisky original.
          required: true
        - label: I searched existing issues for this game.
          required: true
        - label: My issue is written in English.
          required: true
