name: Game Config Submission
description: Share working settings for a game so they can be added to bundled Game Presets.
labels: ["game-compatibility", "gamedb"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template when you have a **working configuration** for a game and want it added to the bundled **Game Presets** (`GameDB.json`).
        If the game is broken and you need assistance, use the **Game Compatibility Report** template instead.

        **Before filing:**
        - Check **PC › Advanced › Game Presets** inside Gmac to see whether an entry already exists.
        - If an entry exists and your settings improve compatibility, submit anyway and explain what changed.
  - type: input
    id: game-name
    attributes:
      label: Game name
      placeholder: "e.g., Baldur's Gate 3"
    validations:
      required: true
  - type: input
    id: game-store
    attributes:
      label: Store / launcher
      description: Where the game was purchased or launched from. Include the Steam App ID for Steam titles.
      placeholder: "e.g., Steam (App ID 1086940), GOG, standalone installer"
    validations:
      required: true
  - type: input
    id: exe-names
    attributes:
      label: Executable name(s)
      description: The game's main `.exe` filenames as shown under **PC › Advanced › Installed Apps**.
      placeholder: "e.g., bg3.exe, bg3_dx11.exe"
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Compatibility rating with these settings
      options:
        - "Works: runs with no issues"
        - "Playable: runs with minor issues"
    validations:
      required: true
  - type: dropdown
    id: graphics-backend
    attributes:
      label: Graphics backend
      options:
        - "Automatic (Recommended)"
        - "DirectX 12 (D3DMetal)"
        - "DirectX 11 (DXMT)"
        - "DirectX 11 (Compatibility / DXVK)"
        - "DirectX 9 / OpenGL / Vulkan (WineD3D)"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings that make it work
      description: |
        List every change from defaults: Windows version, Enhanced Sync, DXVK Async, AVX advertisement,
        Retina Mode, launch arguments, environment variables, winetricks verbs, and registry edits.
        "All defaults" is a valid answer.
    validations:
      required: true
  - type: textarea
    id: known-issues
    attributes:
      label: Remaining issues with this config
      description: Describe any remaining glitches, audio quirks, or performance notes.
  - type: input
    id: gmac-version
    attributes:
      label: Gmac version
      placeholder: "e.g., 4.1.1 (About window)"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g., Tahoe (macOS 26)"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "e.g., MacBook Pro M3 Pro, 18 GB"
    validations:
      required: true
  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: I tested this config on a fresh PC rather than one carrying unrelated tweaks.
          required: true
        - label: I am running this fork (`rolling7ho/gmac`, confirmed via **Gmac › About Gmac**).
          required: true
